# systemd user manager for the `podman` user inside the app container.
# Delegate every controller so the inner podman can enforce --cpus/--memory/--pids on sandboxes.
# No PAM: the image has no logind; the manager is started by multi-user.target instead of a login.
[Service]
Delegate=cpu cpuset io memory pids
PAMName=
Environment=XDG_RUNTIME_DIR=/run/user/%i
