name: Test

# Unit tests on every push and pull request. A `v<semver>` tag must match pyproject.toml: apps pin
# these tags, so a mismatched one would install a different version than its name says.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          init=$(grep -m1 '^__version__' src/sandboxcore/__init__.py | sed 's/.*"\(.*\)".*/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$version" != "$init" ]; then
            echo "tag $GITHUB_REF_NAME, pyproject.toml $version and __init__.py $init must agree"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Install
        run: pip install -e ".[dev]"

      - name: Go runtime
        working-directory: runtimes/go
        run: go vet ./... && go test ./...

      - name: Unit and trace conformance tests (Python and Go runtimes)
        run: python -m pytest -q

  integration:
    # GitHub's runners have rootless podman with cgroup v2; the self-test proves the limits are enforced.
    # Not yet required: whether the runner delegates the cpu controller (`--cpus`) is unproven until the
    # first run here. Drop continue-on-error once it has passed.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Build the reference sandbox image
        run: podman build -f containers/Containerfile.sandbox -t localhost/sandboxcore-sandbox:test .

      - name: Integration tests
        env:
          SANDBOX_INTEGRATION: "1"
          SANDBOX_IMAGE: localhost/sandboxcore-sandbox:test
          SANDBOX_TEST_SLACK_SECONDS: "2"
        run: python -m pytest -m integration -v

  base-image:
    # the app containers' base; published as raubcamaioni/sandboxcore-base:<version> and :latest on a release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME || 'raubcamaioni' }}/sandboxcore-base
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build the base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./system/image/Containerfile.base
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

  deb:
    # the host package; attached to the workflow run (and to a release by hand)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sandboxcore-host
        run: sh system/debian/build.sh

      - name: Install it on a clean Ubuntu
        run: |
          podman run --rm -v "$PWD/dist":/dist:ro docker.io/library/ubuntu:24.04 sh -c '
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /dist/sandboxcore-host_*_all.deb &&
            sandboxcore-adduser app && sandboxcore-adduser app && grep -q "^app:" /etc/subuid'

      - uses: actions/upload-artifact@v4
        with:
          name: sandboxcore-host
          path: dist/*.deb
